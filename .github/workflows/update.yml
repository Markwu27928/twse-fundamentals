name: 更新財報評分

on:
  schedule:
    # 週一到週五 UTC 09:00（台灣 17:00），收盤後
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取全市場資料（含欄位檢查）
        id: fetch
        continue-on-error: true
        run: python src/fetch.py

      - name: 評分與排名
        if: steps.fetch.outcome == 'success'
        run: python src/score.py

      - name: 抓取匯率與外資買賣超（失敗不影響股票資料）
        continue-on-error: true
        run: python src/macro.py

      - name: 提交更新（欄位檢查報告一律提交，方便查錯）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics.json data/macro_history.json docs/macro.json 2>/dev/null || true
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            git add data/companies.json data/turnover_history.json docs/data.json
          fi
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "更新財報評分 $(date -u +%Y-%m-%d)（抓取：${{ steps.fetch.outcome }}）"
            git pull --rebase
            git push
          fi

      - name: 抓取失敗時讓工作流程顯示失敗
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::error::資料抓取或欄位檢查未通過，詳見 data/diagnostics.json"
          exit 1
