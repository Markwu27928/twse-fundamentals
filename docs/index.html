<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台股財報評分</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1a1d21;--muted:#6b7380;--line:#e3e6ea;--accent:#2457d6;
  --buy:#d4333b;--buy-bg:#fdecec;--sell:#16864a;--sell-bg:#e8f6ee;--hold:#5b6573;--hold-bg:#eceff3;--na:#8a93a0;--na-bg:#f0f1f3;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1114;--card:#181b20;--text:#e8eaed;--muted:#98a1ae;--line:#2a2f37;--accent:#7aa2ff;
  --buy:#ff7b81;--buy-bg:#3a1b1d;--sell:#5fd392;--sell-bg:#14301f;--hold:#aab3c0;--hold-bg:#262b33;--na:#8a93a0;--na-bg:#22262c}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 40px}
h1{font-size:18px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.macro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 10px;font-size:13px}
.macro .row2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.macro b{font-size:16px}
.macro .verdict{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.macro .small{color:var(--muted);font-size:12px}
.vd-in{color:var(--buy);background:var(--buy-bg)}.vd-out{color:var(--sell);background:var(--sell-bg)}.vd-mid{color:var(--hold);background:var(--hold-bg)}
.seg{display:flex;background:var(--hold-bg);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 2px;white-space:nowrap;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.controls{display:grid;gap:8px;margin:8px 0}
.row{display:flex;gap:8px}
input[type=search],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:700}
.count{color:var(--muted);font-size:12px;margin:6px 2px}
details.co{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
details.co>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
details.co>summary::-webkit-details-marker{display:none}
.rank{width:22px;height:22px;border-radius:50%;background:var(--hold-bg);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.main{flex:1;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);font-weight:400;margin-left:6px}
.meta{color:var(--muted);font-size:12px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;flex:none}
.l-買進{color:var(--buy);background:var(--buy-bg)}
.l-賣出{color:var(--sell);background:var(--sell-bg)}
.l-觀望{color:var(--hold);background:var(--hold-bg)}
.l-資料不足{color:var(--na);background:var(--na-bg)}
.score{width:38px;text-align:right;font-weight:800;font-size:18px;flex:none}
.body{padding:2px 12px 12px;border-top:1px solid var(--line)}
.body h4{margin:12px 0 6px;font-size:13px;color:var(--muted)}
.m{display:grid;grid-template-columns:96px 1fr 62px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar{height:7px;background:var(--hold-bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.m b{text-align:right;font-weight:600}
ul.pts{margin:4px 0;padding-left:18px;font-size:13px}
.flag{color:var(--buy)}
.ind{margin:18px 2px 4px;font-size:15px;font-weight:800}
.ind-sub{color:var(--muted);font-size:12px;margin:0 2px 4px}
.hot{display:inline-block;font-size:11px;font-weight:700;color:var(--buy);background:var(--buy-bg);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.chip.hi[aria-pressed=true]{border-color:var(--buy);color:var(--buy)}
.revtbl{width:100%;border-collapse:collapse;font-size:13px}
.revtbl td,.revtbl th{padding:4px 2px;text-align:right;border-bottom:1px solid var(--line)}
.revtbl td:first-child,.revtbl th:first-child{text-align:left}
.prod{font-size:12px;color:var(--accent);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--buy)}.down{color:var(--sell)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--hold-bg);color:var(--muted)}
button.more{width:100%;margin:10px 0;padding:11px;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:10px;font:inherit;font-weight:600}
.foot{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
.err{padding:16px;border:1px solid var(--buy);border-radius:10px;background:var(--buy-bg);color:var(--buy)}
</style>
</head>
<body>
<div class="wrap">
  <h1>台股財報評分</h1>
  <div class="sub" id="sub">載入中…</div>
  <div class="macro" id="macro" hidden></div>

  <div class="seg" role="group" aria-label="檢視方式">
    <button id="v-all" aria-pressed="true">全市場</button>
    <button id="v-top" aria-pressed="false">產業前三名</button>
    <button id="v-theme" aria-pressed="false">主題族群</button>
    <button id="v-hot" aria-pressed="false">熱門產品</button>
  </div>

  <div id="ctl-all" class="controls">
    <input type="search" id="q" placeholder="搜尋代號或名稱" aria-label="搜尋">
    <div class="chips" id="chips"></div>
    <div class="row">
      <select id="ind" aria-label="產業"></select>
      <select id="sort" aria-label="排序">
        <option value="score">依評分</option>
        <option value="mcap">依市值</option>
        <option value="rev_yoy">依營收年增</option>
        <option value="pe">依本益比（低到高）</option>
      </select>
    </div>
  </div>

  <div id="ctl-top" class="controls" hidden>
    <select id="theme-pick" aria-label="族群" hidden></select>
    <div class="seg" role="group" aria-label="排名依據">
      <button id="r-score" aria-pressed="true">依評分</button>
      <button id="r-mcap" aria-pressed="false">依市值</button>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="list"></div>
  <div class="foot">
    評分為依設定檔規則計算的財報體質分數，並非預測股價漲跌，也不構成投資建議。<br>
    標籤顏色採台股習慣：買進為紅、賣出為綠。<br>
    「營收連兩月成長」：最近兩個月的單月營收，月增率與年增率都大於 0，評分另加分。<br>
    ROE 以累計淨利年化估算。金融業（銀行、金控、證券、保險）不評毛利率、負債比、流動比。<br>
    資料來源：證交所、櫃買中心開放資料。官方尚未提供財報的公司標示「資料不足」。
  </div>
</div>

<script>
const PAGE = 100;
const LABELS = ["全部", "買進", "觀望", "賣出", "資料不足"];
const st = { view: "all", hi: false, label: "全部", ind: "全部", sort: "score", q: "", rankBy: "score", theme: "全部", limit: PAGE };
let D = null, BY = {};

const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
const fmtMcap = (v) => v == null ? "—" : v >= 10000 ? (v / 10000).toFixed(2) + "兆" : Math.round(v).toLocaleString() + "億";
const rocDate = (d) => { const m = /^(\d{3})(\d{2})(\d{2})$/.exec(d || ""); return m ? `${+m[1] + 1911}/${m[2]}/${m[3]}` : "—"; };
const fmtNum = (v, d = 1) => v == null ? "—" : Number(v).toFixed(d);

function card(c, rank, product) {
  const sum = h("summary", {},
    rank ? h("span", { class: "rank" }, rank) : null,
    h("div", { class: "main" },
      h("div", { class: "nm" }, c.name, h("small", {}, c.code), c.rev_hot ? h("span", { class: "hot" }, `營收連${c.rev.streak}月↑`) : null),
      product ? h("div", { class: "prod" }, "主力產品：" + product) : null,
      h("div", { class: "meta" }, `${c.industry}・${c.market}・市值 ${fmtMcap(c.mcap)}` +
        (c.stale ? "・沿用前次財報" : "") +
        (c.label !== "資料不足" && c.coverage < 0.7 ? "・資料涵蓋度低" : ""))),
    h("span", { class: "badge l-" + c.label }, c.label),
    h("span", { class: "score" }, c.score == null ? "—" : Math.round(c.score)));

  const body = h("div", { class: "body" });
  const keys = Object.keys(D.metric_labels).filter((k) => c.metrics[k] != null);
  body.append(h("h4", {}, `指標明細（財報 ${c.period || "—"}${c.stale ? "，本次官方資料未提供，沿用前次" : ""}；股價 ${rocDate(c.price_date)}；涵蓋度 ${Math.round(c.coverage * 100)}%）`));
  if (c.label === "資料不足") body.append(h("div", { class: "meta" }, "官方開放資料尚未提供此公司財報，暫不給買賣標籤。"));
  if (!keys.length) body.append(h("div", { class: "meta" }, "沒有可用的指標資料"));
  for (const k of keys) {
    const ml = D.metric_labels[k], v = c.metrics[k];
    const shown = (k === "pe" && v >= 999) ? "虧損" : fmtNum(v) + ml.unit;
    body.append(h("div", { class: "m" },
      h("span", {}, ml.label),
      h("div", { class: "bar" }, h("i", { style: `width:${c.subs[k] ?? 0}%` })),
      h("b", {}, shown)));
  }
  if (c.rev && c.rev.month) {
    const ym = (v) => v ? `${v.slice(0, 4)}/${v.slice(4)}` : "—";
    const row = (m, mom, yoy) => h("tr", {}, h("td", {}, ym(m)), h("td", {}, pctSpan(mom, 1)), h("td", {}, pctSpan(yoy, 1)));
    body.append(h("h4", {}, c.rev_hot ? `月營收（連 ${c.rev.streak} 個月月增、年增皆成長）` : "月營收"),
      h("table", { class: "revtbl" },
        h("tr", {}, h("th", {}, "月份"), h("th", {}, "月增"), h("th", {}, "年增")),
        row(c.rev.month, c.rev.mom, c.rev.yoy),
        c.rev.prev_month ? row(c.rev.prev_month, c.rev.prev_mom, c.rev.prev_yoy) : h("tr", {}, h("td", { colspan: "3" }, "上個月資料尚未取得"))));
  }
  if (c.themes && c.themes.length) body.append(h("h4", {}, "所屬族群"), h("div", { class: "tags" }, c.themes.map((t) => h("span", { class: "tag" }, t))));
  if (c.strengths.length) body.append(h("h4", {}, "優勢"), h("ul", { class: "pts" }, c.strengths.map((t) => h("li", {}, t))));
  if (c.weaknesses.length) body.append(h("h4", {}, "弱點"), h("ul", { class: "pts" }, c.weaknesses.map((t) => h("li", {}, t))));
  if (c.flags.length) body.append(h("h4", {}, "風險旗標"), h("ul", { class: "pts flag" }, c.flags.map((t) => h("li", {}, t))));
  return h("details", { class: "co" }, sum, body);
}

function sortVal(c, key) {
  if (key === "pe") { const v = c.metrics.pe; return v == null || v >= 999 ? Infinity : v; }
  if (key === "rev_yoy") return -(c.metrics.rev_yoy ?? -Infinity);
  if (key === "mcap") return -(c.mcap ?? -1);
  return -(c.score ?? -1);
}

function renderAll() {
  const q = st.q.trim().toLowerCase();
  let rows = D.companies.filter((c) =>
    (st.label === "全部" || c.label === st.label) &&
    (!st.hi || c.rev_hot) &&
    (st.ind === "全部" || c.industry === st.ind) &&
    (!q || c.code.includes(q) || c.name.toLowerCase().includes(q)));
  rows.sort((a, b) => sortVal(a, st.sort) - sortVal(b, st.sort) || a.code.localeCompare(b.code));
  $("count").textContent = `共 ${rows.length} 檔`;
  const list = $("list"); list.replaceChildren();
  rows.slice(0, st.limit).forEach((c) => list.append(card(c)));
  if (rows.length > st.limit)
    list.append(h("button", { class: "more", onclick: () => { st.limit += PAGE; renderAll(); } }, `顯示更多（還有 ${rows.length - st.limit} 檔）`));
}

function renderTop() {
  const src = D.top[st.rankBy];
  const by = st.rankBy === "score" ? "評分" : "市值";
  $("count").textContent = `各產業${by}前三名（共 ${D.industries.length} 個產業）`;
  const list = $("list"); list.replaceChildren();
  for (const ind of D.industries) {
    const codes = src[ind] || [];
    if (!codes.length) continue;
    list.append(h("div", { class: "ind" }, ind));
    codes.forEach((code, i) => list.append(card(BY[code], i + 1)));
  }
}

function renderTheme() {
  const names = Object.keys(D.themes || {});
  const by = st.rankBy === "score" ? "評分" : "市值";
  const shown = st.theme === "全部" ? names : names.filter((n) => n === st.theme);
  $("count").textContent = `${shown.length} 個族群，族群內依${by}排序`;
  const list = $("list"); list.replaceChildren();
  for (const n of shown) {
    const g = D.themes[n];
    const codes = g[st.rankBy].filter((c) => BY[c]);
    const lb = ["買進", "觀望", "賣出", "資料不足"].filter((l) => g.labels[l]).map((l) => `${l} ${g.labels[l]}`).join("・");
    list.append(h("div", { class: "ind" }, `${n}（${codes.length} 檔）`),
      h("div", { class: "ind-sub" }, `平均評分 ${g.avg_score == null ? "—" : Math.round(g.avg_score)}｜${lb}` +
        (g.missing.length ? `｜找不到代號：${g.missing.join("、")}` : "")));
    codes.forEach((code, i) => list.append(card(BY[code], i + 1)));
  }
}

function renderHot() {
  const P = D.products || [];
  const by = st.rankBy === "score" ? "評分" : "市值";
  const meta = D.products_meta || {};
  $("count").textContent = `近 ${meta.days || 5} 日平均成交值最高的 ${P.length} 個題材（候選 ${meta.pool || P.length} 個），題材內依${by}排序`;
  const list = $("list"); list.replaceChildren();
  for (const t of P) {
    const codes = t[st.rankBy].filter((c) => BY[c]);
    const lb = ["買進", "觀望", "賣出", "資料不足"].filter((l) => t.labels[l]).map((l) => `${l} ${t.labels[l]}`).join("・");
    const chg = t.change == null ? null : h("span", { class: t.change > 0 ? "up" : t.change < 0 ? "down" : "" },
      `${t.change > 0 ? "+" : ""}${t.change.toFixed(2)}%`);
    list.append(h("div", { class: "ind" }, `#${t.rank} ${t.name}（${codes.length} 檔）`),
      h("div", { class: "ind-sub" }, `均成交值 ${Math.round(t.heat).toLocaleString()} 億｜平均漲跌 `, chg || "—",
        `｜平均評分 ${t.avg_score == null ? "—" : Math.round(t.avg_score)}｜${lb}` +
        (t.missing.length ? `｜找不到代號：${t.missing.join("、")}` : "")));
    codes.forEach((code, i) => list.append(card(BY[code], i + 1, t.items[code])));
  }
}

function render() {
  $("ctl-all").hidden = st.view !== "all";
  $("ctl-top").hidden = st.view === "all";
  $("theme-pick").hidden = st.view !== "theme";
  $("v-theme").setAttribute("aria-pressed", st.view === "theme");
  $("v-hot").setAttribute("aria-pressed", st.view === "hot");
  $("v-all").setAttribute("aria-pressed", st.view === "all");
  $("v-top").setAttribute("aria-pressed", st.view === "top");
  $("r-score").setAttribute("aria-pressed", st.rankBy === "score");
  $("r-mcap").setAttribute("aria-pressed", st.rankBy === "mcap");
  document.querySelectorAll("#chips .chip[data-l]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === st.label));
  $("chip-hi").setAttribute("aria-pressed", st.hi);
  if (st.view === "all") renderAll();
  else if (st.view === "top") renderTop();
  else if (st.view === "theme") renderTheme();
  else renderHot();
}

function pctSpan(v, d = 2) {
  if (v == null) return h("span", {}, "—");
  return h("span", { class: v > 0 ? "up" : v < 0 ? "down" : "" }, `${v > 0 ? "▲" : v < 0 ? "▼" : ""}${Math.abs(v).toFixed(d)}%`);
}
function netSpan(v) {
  return h("span", { class: v > 0 ? "up" : v < 0 ? "down" : "" }, `${v > 0 ? "+" : ""}${Math.round(v).toLocaleString()} 億`);
}
async function loadMacro() {
  const box = $("macro");
  let M = null;
  try {
    const r = await fetch("macro.json", { cache: "no-cache" });
    if (r.ok) M = await r.json();
  } catch (e) { /* 匯率資料暫缺時不影響主頁 */ }
  if (!M || (!M.fx && !M.foreign)) { box.hidden = true; return; }
  box.replaceChildren();
  const fx = M.fx, fr = M.foreign, vd = M.verdict;
  box.append(h("div", { class: "row2" },
    h("div", {}, "美元兌台幣 ", fx ? h("b", {}, fx.rate.toFixed(3)) : "暫缺", fx ? [" ", pctSpan(fx.change_1d_pct), h("span", { class: "small" }, " 單日")] : null),
    fx && fx.change_win_pct != null ? h("div", {}, h("span", { class: "small" }, "近一週 "), pctSpan(fx.change_win_pct)) : null));
  box.append(h("div", { class: "row2" },
    h("div", {}, "外資買賣超 ", fr ? [h("b", {}, netSpan(fr.today)), h("span", { class: "small" }, ` ${fr.date.slice(5)}`)] : "暫缺"),
    fr ? h("div", {}, h("span", { class: "small" }, `近 ${fr.days} 日 `), netSpan(fr.sum)) : null));
  if (vd) {
    const cls = vd.label.includes("匯入") ? "vd-in" : vd.label.includes("匯出") ? "vd-out" : "vd-mid";
    box.append(h("div", { class: "verdict" }, h("span", { class: "badge " + cls }, "判讀：" + vd.label), h("span", { class: "small" }, vd.detail)));
  }
  box.append(h("div", { class: "small", style: "margin-top:4px" },
    "外資買賣超為上市市場；匯率為每日參考匯率。這是資金流向參考指標，不是外資實際匯出入金額。"));
  box.hidden = false;
}

async function init() {
  try {
    const r = await fetch("data.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    D = await r.json();
  } catch (e) {
    $("sub").textContent = "";
    $("list").append(h("div", { class: "err" }, "資料載入失敗：" + e.message));
    return;
  }
  D.companies.forEach((c) => (BY[c.code] = c));
  const d = new Date(D.generated_at);
  const cnt = D.counts;
  $("sub").textContent = `更新：${isNaN(d) ? D.generated_at : d.toLocaleString("zh-TW", { hour12: false })}｜買進 ${cnt["買進"] || 0}・觀望 ${cnt["觀望"] || 0}・賣出 ${cnt["賣出"] || 0}`;

  $("chips").append(h("button", { class: "chip hi", id: "chip-hi", onclick: () => { st.hi = !st.hi; st.limit = PAGE; render(); } }, `★ 營收連兩月成長 ${cnt["營收連兩月成長"] || 0}`));
  $("chips").append(...LABELS.map((l) => h("button", { class: "chip", "data-l": l, onclick: () => { st.label = l; st.limit = PAGE; render(); } }, l)));
  $("ind").append(h("option", { value: "全部" }, "全部產業"), ...D.industries.map((i) => h("option", { value: i }, i)));
  $("ind").onchange = (e) => { st.ind = e.target.value; st.limit = PAGE; render(); };
  $("sort").onchange = (e) => { st.sort = e.target.value; st.limit = PAGE; render(); };
  $("q").oninput = (e) => { st.q = e.target.value; st.limit = PAGE; render(); };
  $("v-all").onclick = () => { st.view = "all"; render(); };
  $("v-top").onclick = () => { st.view = "top"; render(); };
  $("v-theme").onclick = () => { st.view = "theme"; render(); };
  $("v-hot").onclick = () => { st.view = "hot"; render(); };
  $("theme-pick").append(h("option", { value: "全部" }, "全部族群"), ...Object.keys(D.themes || {}).map((n) => h("option", { value: n }, n)));
  $("theme-pick").onchange = (e) => { st.theme = e.target.value; render(); };
  $("r-score").onclick = () => { st.rankBy = "score"; render(); };
  $("r-mcap").onclick = () => { st.rankBy = "mcap"; render(); };
  render();
  loadMacro();
}
init();
</script>
</body>
</html>
